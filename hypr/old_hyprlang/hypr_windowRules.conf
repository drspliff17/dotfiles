# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

windowrule {
    name = pinned-change-border
    match:pin = true
    rounding = 0
    border_size = 3
    border_color = $color4 $color1
    opacity = 0.9 override 0.4 override 1.0 override
}


windowrule {
    name = waypaper-float
    match:class = waypaper
    animation = slide
    float = true
    size = 800 420
    move = 10 (monitor_h-(window_h*0.5)-(window_h*0.20))
}

windowrule {
  name = kitty-fullscreen
  match:class = kitty
  match:fullscreen = true
  opacity = 0.94 override 0.9 override 0.9 override
}

windowrule {
  name = wofi-animations
  match:class = wofi
  animation = fade
  opacity = 0.9 override 0.9 override 0.9 override
}

