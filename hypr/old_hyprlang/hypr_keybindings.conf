# See https://wiki.hypr.land/Configuring/Keywords/
# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more

## Core / Universal Binds
$mainMod = SUPER # using keyd so that Alt_R == SUPER
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod SHIFT, RETURN, exec, [float] $terminal
bindu = $mainMod, escape, submap, reset # emergancy escape incase im a nob

# Move Focus (Tiled, Universal)
bindu = $mainMod, h, movefocus, l
bindu = $mainMod, l, movefocus, r
bindu = $mainMod, k, movefocus, u
bindu = $mainMod, j, movefocus, d

# Cycle Windows (Active Workspace)
bindu = $mainMod, Tab, cyclenext
bindu = $mainMod SHIFT, Tab, cyclenext, prev
bindu = $mainMod CTRL, Tab, cyclenext, floating

# Kill / Toggle Float (Active Window)
bindu = $mainMod, C, killactive,
bindu = $mainMod, V, togglefloating,
bindu = $mainMod SHIFT, V, pin,

## Hypr Action Binds
bind = $mainMod SHIFT, Q, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod SHIFT, S, exec, command steam -shutdown

## Hypr Window Binds
bind = $mainMod, SPACE, centerwindow #floating
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, I, layoutmsg, togglesplit # dwindle
bind = $mainMod, F, fullscreen

bind = $mainMod SHIFT, S, layoutmsg, movetoroot
bind = $mainMod, S, layoutmsg, swapsplit

# Move Windows (Tiled)
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move ALL windows to a workspace with mainMod + SHIFT + CTRL + [0-9]
bind = $mainMod SHIFT CTRL, 1, exec, ~/.config/hypr/scripts/move_all_to_workspace.sh 1
bind = $mainMod SHIFT CTRL, 2, exec, ~/.config/hypr/scripts/move_all_to_workspace.sh 2
bind = $mainMod SHIFT CTRL, 3, exec, ~/.config/hypr/scripts/move_all_to_workspace.sh 3
bind = $mainMod SHIFT CTRL, 4, exec, ~/.config/hypr/scripts/move_all_to_workspace.sh 4
bind = $mainMod SHIFT CTRL, 5, exec, ~/.config/hypr/scripts/move_all_to_workspace.sh 5
bind = $mainMod SHIFT CTRL, 6, exec, ~/.config/hypr/scripts/move_all_to_workspace.sh 6
bind = $mainMod SHIFT CTRL, 7, exec, ~/.config/hypr/scripts/move_all_to_workspace.sh 7
bind = $mainMod SHIFT CTRL, 8, exec, ~/.config/hypr/scripts/move_all_to_workspace.sh 8
bind = $mainMod SHIFT CTRL, 9, exec, ~/.config/hypr/scripts/move_all_to_workspace.sh 9
bind = $mainMod SHIFT CTRL, 0, exec, ~/.config/hypr/scripts/move_all_to_workspace.sh 10

# My Action Binds
bind = $mainMod, W, exec, command fish -c swap_wallpaper
bind = $mainMod, Q, exec, command kitty fish -c "cursor_swap"
bind = $mainMod, Z, exec, command fish -c "killall waybar; waybar &"
bind = , PRINT, exec, grim -g "$(slurp)" -c ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png && notify-send -u low -t 1000 -a center-text "Screenshot taken"
bind = $mainMod, PRINT, exec, grim -c ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png && notify-send -u low -t 1000 -a center-text "Screenshot taken"
bind = $mainMod, F1, exec, timeout 30 ~/.config/hypr/scripts/dmenu_music_selector.sh artist
bind = $mainMod SHIFT, F1, exec, timeout 30 ~/.config/hypr/scripts/dmenu_music_selector.sh files
bind = $mainMod CTRL, F1, exec, timeout 120 ~/.config/hypr/scripts/dmenu_music_selector.sh update
bind = $mainMod, F2, exec, timeout 120 ~/.config/hypr/scripts/dmenu_doc_selector.sh

# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

## Submaps

# Resize Mode (Active Window)
bind = $mainMod, r, submap, Resize
submap = Resize

bind = , slash, exec, ~/.config/hypr/scripts/print_mode_help.sh resize

binde = CTRL,h, resizeactive, -10 0
binde = CTRL,j, resizeactive, 0 -10
binde = CTRL,k, resizeactive, 0 10
binde = CTRL,l, resizeactive, 10 0

binde = ,h, resizeactive, -60 0
binde = ,j, resizeactive, 0 -60
binde = ,k, resizeactive, 0 60
binde = ,l, resizeactive, 60 0

# right idea but bit buggy. TODO: Fix this shite bruh

# bind = ,1, resizeactive, exact 25% 50%
# bind = ,2, resizeactive, exact 50% 50%
# bind = ,3, resizeactive, exact 75% 50%

bind = ,m,submap, MoveFloat
bind = ,SPACE, submap, reset
bind = $mainMod, r, submap, reset

submap = reset

# Move Mode (Floating Windows)
bind = $mainMod, m, submap, MoveFloat
submap = MoveFloat

bind = , slash, exec, ~/.config/hypr/scripts/print_mode_help.sh movefloat

binde = , h, moveactive, -25 0
binde = , j, moveactive, 0 25
binde = , k, moveactive, 0 -25
binde = , l, moveactive, 25 0

binde = CTRL, h, moveactive, -5 0
binde = CTRL, j, moveactive, 0 5
binde = CTRL, k, moveactive, 0 -5
binde = CTRL, l, moveactive, 5 0

bind = , c, centerwindow
bind =, r, submap, Resize
bind = , SPACE, submap, reset
bind = $mainMod, m, submap, reset

submap = reset

# Open Mode(s)
bind = $mainMod, o, submap, Open
submap = Open, reset

bind = , slash, exec, ~/.config/hypr/scripts/print_mode_help.sh open

bind = , SPACE, exec, $menu
bind = , E, exec, $fileManager
bind = , D, exec, Discord&
bind = , B, exec, firefox&
bind = , W, exec, command waypaper
bind = , S, exec, steam&
bind = , M, exec, kitty fish -c cmus

bind = , catchall, submap, reset
bind = $mainMod, o, submap, reset
submap = reset

# Cursor Mode
bind = $mainMod, g, submap, Cursor
submap = Cursor

bind = SHIFT, 1, exec, ~/.config/hypr/scripts/change_cursor_speed.sh -s 5
bind = SHIFT, 2, exec, ~/.config/hypr/scripts/change_cursor_speed.sh -s 50
bind = SHIFT, 3, exec, ~/.config/hypr/scripts/change_cursor_speed.sh -s 100

bind = , 1, exec, ~/.config/hypr/scripts/change_cursor_speed.sh -s 10
bind = , 2, exec, ~/.config/hypr/scripts/change_cursor_speed.sh -s 20
bind = , 3, exec, ~/.config/hypr/scripts/change_cursor_speed.sh -s 40
bind = , 4, exec, ~/.config/hypr/scripts/change_cursor_speed.sh -s 80
bind = , 5, exec, ~/.config/hypr/scripts/change_cursor_speed.sh -s 160
bind = , 6, exec, ~/.config/hypr/scripts/change_cursor_speed.sh -s 320
bind = , 7, exec, ~/.config/hypr/scripts/change_cursor_speed.sh -s 640
bind = , 8, exec, ~/.config/hypr/scripts/change_cursor_speed.sh -s 800
bind = , 9, exec, ~/.config/hypr/scripts/change_cursor_speed.sh -s 900
bind = , 0, exec, ~/.config/hypr/scripts/change_cursor_speed.sh -s 1000

binde = SHIFT, j, exec, ~/.config/hypr/scripts/change_cursor_speed.sh -d 10
binde = SHIFT, k, exec, ~/.config/hypr/scripts/change_cursor_speed.sh -i 10

bind = , g, exec, ~/.config/hypr/scripts/notify_cursor_speed.sh

bind = SHIFT, h, exec, wlrctl pointer click left
bind = SHIFT, l, exec, wlrctl pointer click right
bind = SHIFT, m, exec, wlrctl pointer click middle

bind = , f, exec, ~/.config/hypr/scripts/wlkbptr.sh

binde =, j, exec, ~/.config/hypr/scripts/move_cursor.sh 0 1
binde =, k, exec, ~/.config/hypr/scripts/move_cursor.sh 0 -1
binde =, l, exec, ~/.config/hypr/scripts/move_cursor.sh 1 0
binde =, h, exec, ~/.config/hypr/scripts/move_cursor.sh -1 0

bind = ,SPACE, submap, reset
bind = $mainMod, g, submap, reset

submap = reset


# Notification Mode
bind = $mainMod, d, submap, Notification
submap = Notification

bind = , r, exec, command dunstctl reload
bind = , p, exec, command dunstctl history-pop
bind = , n, exec, command dunstctl close-all
bind = , f, exec, command kitty fish -c "bash -c ~/.config/hypr/scripts/dunst_history_fzf.sh"
bind = , c, exec, ~/.config/hypr/scripts/dunst_history_clear.sh
bind = , g, exec, ~/.config/hypr/scripts/dunst_history_get.sh

bind = $mainMod, d, submap, reset
bind = , catchall, submap, reset
submap = reset



